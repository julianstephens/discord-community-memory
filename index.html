<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Memory — Development Spec</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <span class="kicker">Development specification</span>
          <h1>Community Memory</h1>
        </div>
        <p class="subtitle">
          A readable tabbed view of the long-form product and engineering
          specification.
        </p>
      </header>

      <nav id="tabs" class="tab-bar" aria-label="Document sections"></nav>
      <main id="content" class="content-panel" aria-live="polite"></main>
    </div>

    <script>
      const sections = [];

      function escapeHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalizeTitle(value) {
        return value
          .replace(/^\d+\.\s*/, "")
          .replace(/\s+\|\s+.*$/, "")
          .trim();
      }

      function parseSections(markdown) {
        const lines = markdown.split(/\r?\n/);
        const parsed = [];
        let currentTitle = null;
        let currentBody = [];

        const flush = () => {
          if (!currentTitle) return;
          const content = currentBody.join("\n").trim();
          if (content) parsed.push({ title: currentTitle, body: content });
        };

        for (const line of lines) {
          const match = /^##\s+(.*)$/.exec(line.trim());
          if (match) {
            flush();
            currentTitle = normalizeTitle(match[1]);
            currentBody = [];
            continue;
          }

          if (currentTitle) {
            currentBody.push(line);
          }
        }

        flush();
        return parsed.filter(
          ({ title, body }) =>
            title && body && !/Community Memory/i.test(title),
        );
      }

      function renderInlineMarkdown(text) {
        let escaped = escapeHtml(text);

        escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
        escaped = escaped.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        escaped = escaped.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        escaped = escaped.replace(
          /\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>',
        );

        return escaped;
      }

      function renderList(lines, ordered) {
        const tag = ordered ? "ol" : "ul";
        let html = `<${tag}>`;
        for (const line of lines) {
          html += `<li>${renderInlineMarkdown(line)}</li>`;
        }
        html += `</${tag}>`;
        return html;
      }

      function renderMarkdownBody(body) {
        const lines = body.split(/\r?\n/);
        let html = "";
        let listItems = [];
        let orderedList = false;
        let inCodeBlock = false;
        let codeLines = [];
        let inTable = false;
        let tableRows = [];

        const flushList = () => {
          if (listItems.length) {
            html += renderList(listItems, orderedList);
            listItems = [];
            orderedList = false;
          }
        };

        const flushCode = () => {
          if (inCodeBlock) {
            html += `<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`;
            codeLines = [];
            inCodeBlock = false;
          }
        };

        const flushTable = () => {
          if (!inTable || !tableRows.length) return;

          const rows = tableRows.map((row) =>
            row.split(/\s{2,}/).map((cell) => cell.trim()),
          );
          const header = rows[0];
          const bodyRows = rows.slice(1);

          html +=
            "<table><thead><tr>" +
            header
              .map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`)
              .join("") +
            "</tr></thead><tbody>";
          for (const row of bodyRows) {
            if (!row.length) continue;
            html +=
              "<tr>" +
              row
                .map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`)
                .join("") +
              "</tr>";
          }
          html += "</tbody></table>";

          tableRows = [];
          inTable = false;
        };

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();

          if (line.startsWith("```")) {
            flushList();
            flushTable();
            if (inCodeBlock) {
              flushCode();
            } else {
              inCodeBlock = true;
            }
            continue;
          }

          if (inCodeBlock) {
            codeLines.push(rawLine);
            continue;
          }

          if (!line.trim()) {
            flushList();
            flushTable();
            continue;
          }

          const blockquoteMatch = /^>\s*(.*)$/.exec(line);
          if (blockquoteMatch) {
            flushList();
            html += `<blockquote>${renderInlineMarkdown(blockquoteMatch[1])}</blockquote>`;
            continue;
          }

          const headingMatch = /^###\s+(.*)$/.exec(line);
          if (headingMatch) {
            flushList();
            flushTable();
            html += `<h3>${renderInlineMarkdown(headingMatch[1])}</h3>`;
            continue;
          }

          const tableLike =
            /^([A-Za-z][^\t|]+)\s*\|\s*([A-Za-z][^\t|]*)\s*$/.exec(line);
          if (tableLike && !line.includes(":---")) {
            flushList();
            inTable = true;
            tableRows.push(line.replace(/\s*\|\s*/g, " | "));
            continue;
          }

          if (inTable && /^[A-Za-z].*\|.*$/.test(line)) {
            tableRows.push(line.replace(/\s*\|\s*/g, " | "));
            continue;
          }

          if (inTable) {
            flushTable();
          }

          const listMatch = /^-\s+(.*)$/.exec(line);
          if (listMatch) {
            if (!listItems.length || orderedList) {
              flushList();
              listItems = [];
              orderedList = false;
            }
            listItems.push(listMatch[1]);
            continue;
          }

          const orderedListMatch = /^\d+\.\s+(.*)$/.exec(line);
          if (orderedListMatch) {
            if (!listItems.length || !orderedList) {
              flushList();
              listItems = [];
              orderedList = true;
            }
            listItems.push(orderedListMatch[1]);
            continue;
          }

          flushList();
          html += `<p>${renderInlineMarkdown(line)}</p>`;
        }

        flushList();
        flushCode();
        flushTable();
        return html;
      }

      function renderSection(sectionIndex, section) {
        const article = document.createElement("article");
        article.className = "doc-section";
        article.dataset.index = String(sectionIndex);
        article.innerHTML = `
          <h2>${escapeHtml(section.title)}</h2>
          ${renderMarkdownBody(section.body)}
        `;
        return article;
      }

      async function init() {
        const response = await fetch("./community-memory-spec.md");
        if (!response.ok) {
          document.getElementById("content").innerHTML =
            "<p>Unable to load the specification.</p>";
          return;
        }

        const markdown = await response.text();
        const allSections = parseSections(markdown);
        const tabsEl = document.getElementById("tabs");
        const contentEl = document.getElementById("content");

        allSections.forEach((section, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tab-button";
          button.textContent = section.title;
          button.setAttribute("role", "tab");
          button.setAttribute("aria-selected", index === 0 ? "true" : "false");
          button.addEventListener("click", () => setActiveTab(index));
          tabsEl.appendChild(button);

          const sectionNode = renderSection(index, section);
          contentEl.appendChild(sectionNode);
        });

        setActiveTab(0);
      }

      function setActiveTab(index) {
        const tabButtons = document.querySelectorAll(".tab-button");
        const sectionNodes = document.querySelectorAll(".doc-section");

        tabButtons.forEach((button, buttonIndex) => {
          const active = buttonIndex === index;
          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", String(active));
        });

        sectionNodes.forEach((node, nodeIndex) => {
          node.classList.toggle("active", nodeIndex === index);
        });
      }

      init();
    </script>
  </body>
</html>
