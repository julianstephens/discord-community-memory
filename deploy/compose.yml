services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "3000:3000"
    env_file:
      - ../.env
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    env_file:
      - ../.env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
